name: CI Build

# 每次推送代码后自动编译（所有分支）；也可在 Actions 页面手动触发
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与项目现有 workflow 保持一致：JetBrains Runtime 21
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # app 的 preBuild 会构建 web-ui 前端，需先装好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 本 fork 没有配置 Firebase secrets，生成一个占位文件让 google-services 插件通过校验。
      # 覆盖正式包名（release 变体使用）。
      - name: Generate placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "rikkahub-ci-placeholder",
              "storage_bucket": "rikkahub-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1111111111111111111111",
                  "android_client_info": { "package_name": "me.hg.rikkahub" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMYKEYDUMMYKEYDUMMYKEYDUMMYKEY" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:2222222222222222222222",
                  "android_client_info": { "package_name": "me.hg.rikkahub.debug" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMYKEYDUMMYKEYDUMMYKEYDUMMYKEY" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # 从 Secrets 恢复签名 keystore，并写入 local.properties 的签名配置
      - name: Setup signing
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          echo "$KEY_BASE64" | base64 -d > app/release.jks
          cat > local.properties <<EOF
          storeFile=app/release.jks
          storePassword=$SIGNING_PASSWORD
          keyAlias=$SIGNING_ALIAS
          keyPassword=$SIGNING_PASSWORD
          EOF

      # release 变体使用正式签名，构建可发布安装的 APK
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --stacktrace

      # 发布到固定 tag "latest" 的发行版，每次编译覆盖旧 APK，用户始终下载到最新版。
      # prerelease 标记为预发布，与正式版本 tag（3.3.1）区分。
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: Latest Build (自动编译)
          prerelease: true
          overwrite_files: true
          body: |
            自动编译构建（release 签名版），每次推送代码后更新。

            - Commit: `${{ github.sha }}`
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 分支: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/github/release/*.apk
          fail_on_unmatched_files: true
